name: CI

on:
  push:
    branches: [master]
    paths:
      - "**.py"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & 格式检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"

  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行模拟功能测试
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'lesson01')
          import main

          # 验证函数存在且可调用
          assert callable(main.show_menu)
          assert callable(main.get_choice)
          assert callable(main.input_contact)
          assert callable(main.add_contact)
          assert callable(main.show_contacts)
          assert callable(main.delete_contact)

          # 验证 add_contact 功能
          contacts = []
          person = ['张三', '13800138000']
          main.add_contact(contacts, person)
          assert len(contacts) == 1
          assert contacts[0][0] == '张三'
          assert contacts[0][1] == '13800138000'

          print('全部测试通过')
          "